<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panóptico - Registro de Expedientes</title>
    <style>
        :root {
            --bg-dark: #1e1e24;
            --bg-panel: #2b2d31;
            --bg-header: #111214;
            --text-main: #cfd2d6;
            --text-muted: #a3a6aa;
            --accent-blue: #5865F2;
            --accent-red: #ed4245;
            --accent-green: #3ba55c;
            --border-color: #1e1f22;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', Tahoma, sans-serif; padding: 40px; margin: 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-red); padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #ffffff; margin: 0; display: flex; align-items: center; gap: 10px; font-size: 28px; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-export { background-color: var(--accent-green); }
        .btn-search { background-color: var(--accent-blue); }
        .btn-clear { background-color: #4f545c; }
        .btn-purge { background-color: var(--accent-red); padding: 8px 16px; font-size: 13px; }
        
        .search-bar { display: flex; gap: 15px; margin-bottom: 20px; background-color: var(--bg-header); padding: 15px; border-radius: 8px; }
        .search-input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-dark); color: white; font-size: 15px; }
        .search-input:focus { outline: 1px solid var(--accent-blue); }
        
        .stats { margin-bottom: 15px; color: var(--text-muted); font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; background-color: var(--bg-panel); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-header); color: var(--text-muted); text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
        tr:hover { background-color: #313338; }
        
        code { background-color: var(--bg-header); padding: 6px 10px; border-radius: 4px; font-family: monospace; color: #00a8fc; font-size: 13px; }
        .alias-text { color: #ffffff; font-weight: 600; font-size: 15px; }
        .infracciones-count { color: var(--accent-red); font-weight: bold; font-size: 16px; }
        .ultima-actividad { color: var(--text-muted); font-size: 14px; }
        .id-link { color: #00a8fc; text-decoration: none; font-family: monospace; font-weight: bold; }
        .id-link:hover { text-decoration: underline; }

        /* Estilos de la Ventana Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--bg-panel); border: 1px solid var(--border-color); width: 650px; max-width: 90%; border-radius: 8px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); position: relative; color: var(--text-main); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 20px; color: #fff; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .history-list { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .history-item { background-color: var(--bg-dark); border-left: 4px solid var(--accent-red); padding: 12px 15px; margin-bottom: 10px; border-radius: 4px; }
        .history-date { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .history-action { font-size: 14px; font-weight: 600; color: #fff; }
        .history-case { font-size: 11px; color: #00a8fc; margin-top: 6px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>🛡️ Registro de Expedientes</h1>
        <a href="/panel/exportar?q={{QUERY}}" class="btn btn-export">⬇️ Exportar CSV</a>
    </div>

    <form method="GET" action="/panel" class="search-bar">
        <input type="text" name="q" class="search-input" placeholder="Buscar por ID o Alias..." value="{{QUERY}}">
        <button type="submit" class="btn btn-search">🔍 Buscar</button>
        <a href="/panel" class="btn btn-clear">❌ Limpiar</a>
    </form>

    <div class="stats">Sujetos filtrados: <strong style="color: white;">{{TOTAL_RESULTADOS}}</strong></div>

    <table>
        <thead>
            <tr>
                <th>ID del Sujeto</th>
                <th>Alias</th>
                <th>Infracciones</th>
                <th>Primer Ingreso</th>
                <th>Última Actividad</th>
                <th style="text-align: right;">Acción</th>
            </tr>
        </thead>
        <tbody>
            {{FILAS_TABLA}}
        </tbody>
    </table>

    <!-- Estructura del Modal de Historial -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Expediente Táctico</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalSub" class="stats" style="margin-bottom: 15px;"></div>
            <div class="history-list" id="modalHistoryList">
                <!-- Inyección dinámica -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('id-link')) {
                e.preventDefault();
                const userId = e.target.getAttribute('data-userid');
                const alias = e.target.getAttribute('data-alias');
                const encoded = e.target.getAttribute('data-historial');
                
                try {
                    const jsonString = atob(encoded);
                    const history = JSON.parse(jsonString);
                    
                    document.getElementById('modalTitle').innerText = `Expediente: ${alias}`;
                    document.getElementById('modalSub').innerHTML = `ID del Sujeto: <code>${userId}</code> | Total de Infracciones Registradas: <strong>${history.length}</strong>`;
                    
                    let listHTML = '';
                    // Mostrar los delitos más recientes primero
                    const sortedHistory = [...history].reverse();
                    sortedHistory.forEach((item) => {
                        const fechaFormateada = new Date(item.fecha).toLocaleString('es-ES');
                        listHTML += `
                            <div class="history-item">
                                <div class="history-date">📅 ${fechaFormateada}</div>
                                <div class="history-action">⚡ ${item.accion}</div>
                                <div class="history-case">ID de Caso: ${item.casoId || 'N/A'}</div>
                            </div>
                        `;
                    });
                    
                    document.getElementById('modalHistoryList').innerHTML = listHTML;
                    document.getElementById('historyModal').style.display = 'flex';
                } catch (err) {
                    console.error('Error al procesar el historial criminal:', err);
                }
            }
        });

        function closeModal() {
            document.getElementById('historyModal').style.display = 'none';
        }

        // Cerrar modal al hacer clic fuera del contenedor principal
        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
