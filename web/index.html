<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Biblioteca // Rz</title>
    
    <!-- Tipografías Elegantes: Cinzel (Títulos) y Lora (Cuerpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Dependencias Externas -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <!-- Hojas de Estilo Estructuradas -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
    
    <!-- PANTALLA DE AUTENTICACIÓN (Estética Elegante de La Biblioteca) -->
    <div id="login-modal" class="login-overlay active">
        <!-- Eliminado el efecto scanlines y glitch -->
        <div class="login-panel elegant-panel">
            <div class="login-header">
                <h1 class="library-title">LA BIBLIOTECA</h1>
                <p class="library-subtitle">Archivo Central de Inteligencia // Rz</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="admin-username">Identificador de Operador</label>
                    <input type="text" id="admin-username" autocomplete="off" placeholder="Ej: Admin" required>
                </div>
                <div class="input-group">
                    <label for="admin-password">Clave de Acceso</label>
                    <input type="password" id="admin-password" autocomplete="off" placeholder="Ingrese su clave maestra..." required>
                </div>
                <button type="submit" class="btn-elegant">ABRIR LOS ARCHIVOS</button>
            </form>
            
            <div id="login-error" class="login-error hidden">
                Acceso denegado. Credenciales no reconocidas en el registro.
            </div>
        </div>
    </div>

    <!-- ESTRUCTURA PRINCIPAL DE LA APLICACIÓN -->
    <div id="app-wrapper" class="app-wrapper hidden">
        
        <!-- BARRA LATERAL ELEGANTE -->
        <nav class="tactical-sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-icon">🏛️</span>
                </div>
                <span class="logo-text">LA BIBLIOTECA</span>
            </div>
            <ul class="nav-menu" id="main-nav">
                <li class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Telemetría</span>
                </li>
                <li class="nav-item" data-view="expedientes">
                    <span class="nav-icon">📁</span>
                    <span class="nav-label">Expedientes OSINT</span>
                </li>
                <li class="nav-item" data-view="links">
                    <span class="nav-icon">🔗</span>
                    <span class="nav-label">LinksPortal</span>
                </li>
                <li class="nav-item" data-view="blacklist">
                    <span class="nav-icon">⚖️</span>
                    <span class="nav-label">Registro Disciplinario</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot online"></span>
                    <span class="status-text">Archivos en línea</span>
                </div>
                <button id="btn-logout" class="btn-logout">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-label">Cerrar Sesión</span>
                </button>
            </div>
        </nav>

        <!-- ZONA DE TRABAJO -->
        <main class="main-content">
            <!-- CABECERA SUPERIOR -->
            <header class="topbar">
                <div class="breadcrumbs">
                    <span class="path-root">Archivos Centrales</span>
                    <span class="separator">/</span>
                    <span id="current-path" class="path-current">TELEMETRÍA</span>
                </div>
                <div class="topbar-actions">
                    <span class="library-clock" id="system-clock">00:00:00</span>
                </div>
            </header>
            
            <!-- RAÍZ DE LA SPA: INYECCIÓN DINÁMICA -->
            <section id="spa-root" class="view-container">
                <!-- El contenido será cargado por app.js -->
            </section>
        </main>
    </div>

    <!-- Carga de Scripts Modulares -->
    <!-- 1. Vistas Visuales -->
    <script src="js/vistas/dashboard.js"></script>
    <script src="js/vistas/expedientes.js"></script>
    <script src="js/vistas/links.js"></script>
    <script src="js/vistas/blacklist.js"></script>
    
    <!-- 2. Core (Motor y conexiones) -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    
    <!-- 3. SCRIPT DE SEGURIDAD INDEPENDIENTE -->
    <script src="js/login.js"></script>
</body>
</html>
