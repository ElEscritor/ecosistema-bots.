<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Biblioteca // Centro de Mando e Inteligencia Rz</title>

    <!-- Tipografías optimizadas: Inter para lectura limpia de UI, JetBrains Mono para telemetría, Cinzel para identidad Rz -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- Sistema de Diseño Unificado (Sin parches inline) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body>

    <!-- PANTALLA DE AUTENTICACIÓN -->
    <div id="login-modal" class="login-overlay active">
        <div class="login-panel">
            <div class="login-header">
                <div class="brand-badge">C4ISR // ARCHIVO CENTRAL</div>
                <h1 class="library-title">LA BIBLIOTECA</h1>
                <p class="library-subtitle">División de Inteligencia RzCentral</p>
            </div>

            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="admin-username">IDENTIFICADOR DE OPERADOR</label>
                    <input type="text" id="admin-username" autocomplete="username" placeholder="Ej: Admin" required>
                </div>
                <div class="input-group">
                    <label for="admin-password">CLAVE MAESTRA</label>
                    <input type="password" id="admin-password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-cyber">
                    FRANQUEAR ACCESO
                </button>
            </form>

            <div id="login-error" class="login-error hidden">
                [!] CREDENCIALES RECHAZADAS.
            </div>
        </div>
    </div>

    <!-- ESTRUCTURA PRINCIPAL SPA -->
    <div id="app-wrapper" class="app-wrapper hidden">

        <!-- BARRA LATERAL TÁCTICA -->
        <aside class="tactical-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <span class="logo-text">LA BIBLIOTECA</span>
                    <span class="logo-subtext">SISTEMA PANÓPTICO</span>
                </div>
            </div>

           <ul class="nav-menu" id="main-nav">
                <li class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">◈</span>
                    <span class="nav-label">Telemetría</span>
                </li>
                <li class="nav-item" data-view="red">
                    <span class="nav-icon">◉</span>
                    <span class="nav-label">Mapa de Red</span>
                </li>
                <li class="nav-item" data-view="expedientes">
                    <span class="nav-icon">▤</span>
                    <span class="nav-label">Expedientes</span>
                </li>
                <li class="nav-item" data-view="links">
                    <span class="nav-icon">⌘</span>
                    <span class="nav-label">Radar de Alianzas</span>
                </li>
                <li class="nav-item" data-view="blacklist">
                    <span class="nav-icon">⛨</span>
                    <span class="nav-label">Blacklists</span>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot online"></span>
                    <span class="status-text">ENLACE ACTIVO</span>
                </div>
                <button id="btn-logout" class="btn-logout" type="button">
                    <span class="nav-icon">🔒</span>
                    <span class="nav-label">Sellar Archivos</span>
                </button>
            </div>
        </aside>

        <!-- ZONA DE TRABAJO PRINCIPAL -->
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumbs">
                    <span class="path-root">ARCHIVO CENTRAL</span>
                    <span class="separator">/</span>
                    <span id="current-path" class="path-current">TELEMETRÍA</span>
                </div>
                <div class="topbar-actions">
                    <span class="clock-label">UTC/LOCAL</span>
                    <span class="terminal-clock" id="system-clock">00:00:00</span>
                </div>
            </header>

            <!-- CONTENEDOR DINÁMICO DE VISTAS -->
            <section id="spa-root" class="view-container"></section>
        </main>
    </div>

    <!-- Vistas Modulares -->
    <script src="js/vistas/dashboard.js"></script>
    <script src="js/vistas/expedientes.js"></script>
    <script src="js/vistas/links.js"></script>
    <script src="js/vistas/blacklist.js"></script>
    <script src="js/vistas/red.js"></script>

    <!-- Motor de API y Enrutador SPA -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
